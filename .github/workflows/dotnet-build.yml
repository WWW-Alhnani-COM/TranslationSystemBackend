name: .NET Build

on:
  push:
    branches:
      - main
      - deployment-preparation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TranslationSystemBackend.csproj
      - name: Build
        run: dotnet build TranslationSystemBackend.csproj --no-restore --configuration Release
